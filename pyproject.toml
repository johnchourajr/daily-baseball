[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dailyball"
version = "0.1.0"
description = "A pre-stored daily baseball fun-facts email generator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "John Choura" }]
keywords = ["baseball", "email", "newsletter", "automation", "trivia"]
dependencies = []

[project.scripts]
dailyball = "dailyball.generate:main"

[tool.setuptools.packages.find]
where = ["src"]
